name: Сборка для хостинга

# При каждом пуше в main (и вручную) собирает zip, который можно загрузить на хостинг без SSH:
# Actions → нужный запуск → Artifacts → zefir-shop.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, intl, gd, curl, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: bash scripts/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: zefir-shop
          path: dist/zefir-shop.zip
