<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Товар — Зефир и пряник</title>
    <meta name="description" content="Кондитерская «Зефир и пряник», Москва: десерты ручной работы с самовывозом и доставкой.">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&family=Caveat:wght@500&display=swap">
    <link rel="stylesheet" href="css/shop.css">
</head>

<body>
    <div id="site-header"></div>

    <main class="g" style="padding-block:24px 120px">
        <div class="w" style="display:flex;flex-direction:column;gap:32px" id="root">
            <nav class="crumbs" aria-label="Навигация"><a href="catalog.html">Каталог</a><span aria-hidden="true">/</span><span id="crumb">…</span></nav>
            <div class="pdp" id="pdp"></div>
        </div>
    </main>

    <div id="site-footer"></div>

    <script src="js/products.js"></script>
    <script src="js/shop.js"></script>
    <script>
        Shop.init({ active: 'catalog' });
        (function () {
            var $ = Shop.$, esc = Shop.esc, rub = Shop.rub, I = Shop.ICON;
            var p = Shop.product(new URLSearchParams(location.search).get('id'));
            if (!p) { location.replace('catalog.html'); return; }

            document.title = p.name + ' — Зефир и пряник';
            var md = document.querySelector('meta[name="description"]');
            if (md) md.content = p.name + ': ' + (p.long || p.short) + ' Кондитерская «Зефир и пряник», Москва.';
            $('#crumb').textContent = p.name;

            var vs = Shop.variants(p), vid = vs[0].id, qty = 1;
            var buyable = Shop.buyable(p);
            var cardField = buyable ? true : false;

            function html() {
                var out = '<div class="gal"><div class="photo"><img src="' + p.img + '" alt="' + esc(p.name) + '" width="800" height="640">' +
                    '<span class="badges">' + (p.pp ? '<span class="badge pp">Без сахара</span>' : '') + (p.order ? '<span class="badge ord">На заказ</span>' : '') + '</span></div></div>';
                out += '<div class="info"><div style="display:flex;flex-direction:column;gap:14px">' +
                    (p.isNew ? '<span class="label">Новинка</span>' : '') + '<h1>' + esc(p.name) + '</h1>' +
                    '<p class="lead" style="font-size:17px;line-height:28px">' + esc(p.long || p.short) + '</p></div>';

                if (buyable) {
                    if (vs.length > 1) {
                        out += '<fieldset class="opts"><legend>Формат</legend>' + vs.map(function (v) {
                            return '<label class="opt"><input type="radio" name="fmt" value="' + v.id + '"' + (v.id === vid ? ' checked' : '') + '><span class="t">' + esc(v.label) + (v.sub ? '<small>' + esc(v.sub) + '</small>' : '') + '</span><span class="pr">' + rub(v.price) + '</span></label>';
                        }).join('') + '</fieldset>';
                    }
                    if (p.k === 'cake') out += '<div class="made"><svg class="i" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Соберём утром в день выдачи. Хранить 72 часа в холоде.</div>';
                    out += '<div class="field" style="flex:none"><label for="note">Текст открытки</label><input class="inp hand-i" id="note" maxlength="90" placeholder="Необязательно"><span class="hint">Напишем от руки, до 90 знаков</span></div>';
                    out += '<div class="buyrow"><div class="qty lg" role="group" aria-label="Количество"><button type="button" data-q="-1" aria-label="Меньше">' + I.minus + '</button><output class="tn" id="qv">1</output><button type="button" data-q="1" aria-label="Больше">' + I.plus + '</button></div>' +
                        '<button class="btn btn-main" type="button" id="addBtn">В корзину · <span class="tn" id="sumv"></span></button></div>';
                } else {
                    out += '<div style="display:flex;align-items:baseline;gap:16px;flex-wrap:wrap"><span class="price" style="font-size:22px">' + Shop.priceText(p) + '</span></div>' +
                        '<p class="small">' + (p.out ? 'Сейчас нет в наличии. Напишите нам, и мы сообщим о поступлении.' : p.order ? 'Делаем на заказ. Цену и сроки назовём после обсуждения, заказывайте минимум за 3 дня.' : 'Цену назовём по запросу.') + '</p>' +
                        '<div class="buyrow"><a class="btn btn-main" href="info.html#contacts">' + (p.out ? 'Сообщить о поступлении' : p.order ? 'Обсудить заказ' : 'Уточнить цену') + '</a></div>';
                }
                if (p.allergens) out += '<dl class="dl"><dt>Аллергены</dt><dd>' + esc(p.allergens) + '</dd></dl>';
                return out + '</div>';
            }
            function sum() { var s = $('#sumv'); if (s) s.innerHTML = rub(Shop.variant(p, vid).price * qty); }

            $('#pdp').innerHTML = html(); sum();
            $('#pdp').addEventListener('change', function (e) { if (e.target.name === 'fmt') { vid = e.target.value; sum(); } });
            $('#pdp').addEventListener('click', function (e) {
                var q = e.target.closest('[data-q]');
                if (q) { qty = Math.max(1, Math.min(20, qty + (+q.dataset.q))); $('#qv').textContent = qty; sum(); return; }
                if (e.target.closest('#addBtn')) {
                    var note = $('#note').value.trim();
                    Shop.add(p.id, vid, qty);
                    if (note) Shop.setCard({ on: true, text: note });
                }
            });
        })();
    </script>
</body>

</html>
